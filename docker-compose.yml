services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concurrency
      POSTGRES_PASSWORD: concurrency
      POSTGRES_DB: concurrency
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurrency"]
      interval: 2s
      timeout: 5s
      retries: 10
